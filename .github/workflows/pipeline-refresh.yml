# Scheduled source checks and reviewed data publication.
#
# WHEN THIS ACTUALLY RUNS  -- read before assuming it is live
#
#   schedule:          GitHub runs scheduled workflows ONLY from the DEFAULT
#                      branch. This file IS on main, so the cron below fires.
#                      A copy of this file on a feature branch does not run on
#                      a schedule, however recently it was edited - only what
#                      main holds runs.
#
#   workflow_dispatch: the "Run workflow" button exists, because the workflow
#                      exists on the default branch. It can target any branch
#                      from the dropdown.
#
#   So the version of this file that matters is the one on main. Editing it on
#   a branch changes nothing until that branch is merged. This paragraph used
#   to say the cron did not fire at all, which was true while the file lived
#   only on feat/data-pipeline and became false the moment it was merged; a
#   comment that stops being true is worse than no comment.
#
# WHAT IT DOES
#
#   check   reaches every source, compares versions, writes nothing
#   refresh regenerates exports when a source changed, then opens a PULL
#           REQUEST with the result
#
# The scheduled run does BOTH. It used to run `check` and stop, because the
# refresh job required `github.event_name == workflow_dispatch` - so "automatic
# source updates" needed a person to notice the check and click Run workflow.
# Nobody ever did, and the FDA label data went stale while the workflow
# reported green every morning. A detector nobody reads is not a detector.
#
# It still never publishes on its own. A refresh opens a pull request and stops
# there; medical and coverage content is reviewed by a person before merge. A
# green check here means "a candidate is ready to look at", not "the data is
# correct".
name: pipeline-refresh

on:
  schedule:
    # 07:15 UTC daily. Off the hour on purpose: the top of the hour is the
    # busiest slot on shared runners and scheduled jobs are dropped under load.
    # Daily polling against sources that publish monthly is deliberate
    # over-checking; it is cheap and it bounds detection latency to a day.
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = look only. refresh = regenerate and open a PR."
        type: choice
        options: ["check", "refresh"]
        default: "check"
      sources:
        description: "Space-separated source ids to limit to (blank = all)."
        type: string
        default: ""
      force:
        description: "Refresh even when no change is detected."
        type: boolean
        default: false

# Default to read-only. The publication job raises this for itself alone.
permissions:
  contents: read

# One publication run at a time. Two concurrent runs would race on the same
# branch and could interleave half-written exports.
concurrency:
  group: pipeline-refresh
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  check:
    name: check sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      # Produced by `npm run refresh:decide`, which applies the ONE definition
      # of "should this run ingest" in data-pipeline/src/refresh/decide.ts.
      ingest: ${{ steps.check.outputs.ingest }}
      reason: ${{ steps.check.outputs.reason }}
      changed: ${{ steps.check.outputs.changed }}
      refresh_due: ${{ steps.check.outputs.refresh_due }}
    defaults:
      run:
        working-directory: data-pipeline

    steps:
      # actions/checkout v4.2.2
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # actions/setup-node v4.1.0
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: data-pipeline/package-lock.json

      - name: Install
        run: npm ci
        timeout-minutes: 5

      - name: Confirm credential wiring without printing it
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
        run: npm run env:check
        timeout-minutes: 2

      - name: Check sources
        id: check
        env:
          # Read from the repository Actions secret of the same name. If the
          # secret is unset this is empty, and openFDA still works at a lower
          # rate limit - so a missing key degrades the run, it does not fail it.
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          SOURCES: ${{ inputs.sources }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          FORCE: ${{ inputs.force }}
        # Source ids are passed through an environment variable and expanded by
        # the shell, never interpolated into the script body. Retrieved content
        # is data and is never placed on a command line.
        run: |
          set -euo pipefail
          args=""
          for s in ${SOURCES:-}; do args="$args --source $s"; done
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            args="$args --event workflow_dispatch --mode ${MODE:-check}"
            if [ "${FORCE}" = "true" ]; then args="$args --force"; fi
          else
            args="$args --event schedule"
          fi
          # The decision is made by the pipeline and written to GITHUB_OUTPUT
          # there. This step no longer parses a human-readable report: the old
          # `grep -E "^checked .* changed [1-9]"` coupled ingestion to the
          # wording of a log line, could not be tested, and ignored
          # refresh-due entirely.
          # shellcheck disable=SC2086
          npm run refresh:decide -- $args | tee refresh-report.txt
        timeout-minutes: 12

      - name: Publish run summary
        if: always()
        run: |
          {
            echo "## Source check"
            echo ""
            echo '```'
            cat refresh-report.txt || echo "(no report produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # actions/upload-artifact v4.4.3
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: refresh-report
          path: data-pipeline/refresh-report.txt
          retention-days: 14
          if-no-files-found: warn

  refresh:
    name: regenerate and open a review PR
    needs: check
    # One condition, and it is not a policy: the policy lives in
    # data-pipeline/src/refresh/decide.ts and is exhaustively tested as a truth
    # table in data-pipeline/tests/decide.test.ts. Re-expressing it here in
    # YAML is how the two drifted apart in the first place - the scheduled arm
    # was excluded entirely and nothing could catch it.
    if: needs.check.outputs.ingest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Raised HERE ONLY, for the one job that must write a branch and a PR.
      contents: write
      pull-requests: write

    steps:
      # actions/checkout v4.2.2
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-node v4.1.0
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: data-pipeline/package-lock.json

      - name: Install
        working-directory: data-pipeline
        run: npm ci
        timeout-minutes: 5

      - name: Regenerate exports
        working-directory: data-pipeline
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
        run: |
          set -euo pipefail
          npm run ingest
          npm run export
          npm run insurance:ingest
          npm run insurance:export
          npm run access:export
          # The application's own snapshot shape. Without this the app rejects
          # the pipeline's shape at load and the coverage flow reports
          # "unable to verify" for every request - silently, with no failure
          # anywhere in this workflow.
          npm run app:snapshot
          npm run report
        timeout-minutes: 30

      # Validation runs AFTER regeneration and BEFORE the PR. A candidate that
      # fails here is never proposed.
      - name: Validate the regenerated bundle
        working-directory: data-pipeline
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
        timeout-minutes: 10

      # A refresh that stops at data-pipeline/data has refreshed nothing a
      # reader can see: the app imports the VENDORED copies under
      # src/sources/content/, and those only change when this runs. This is the
      # step whose absence let the pipeline and the deployed site drift apart
      # while every job stayed green.
      #
      # content:sync copies the label exports, the plan directory and the
      # app-shaped coverage snapshot, and derives each product's RxNorm concept
      # identities from the normalized records the ingest just wrote - no
      # second network call, so the labels and the identity map cannot come
      # from different moments.
      - name: Sync the vendored copies the app actually reads
        run: node scripts/sync-label-exports.mjs
        timeout-minutes: 5

      # The app-side checks, against the newly synced content: typecheck, lint,
      # tests AND the production build. A candidate that breaks the application
      # is never proposed, however valid the pipeline considers its own exports.
      # The tests include tests/coverage-snapshot.test.ts, which checks the
      # app's answers against the pipeline's own coverage-examples.json from
      # this same run, so the two cannot disagree about a plan's drug list.
      - name: Validate the application against the refreshed content
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
        timeout-minutes: 20

      # Only now, with everything regenerated and validated, record that the
      # sources were retrieved. This is what clears `refreshDue`; nothing else
      # sets it. It runs LAST so a failure anywhere above leaves the baseline
      # untouched and the next scheduled run tries again. Without it every
      # source stays "never retrieved" and the schedule would regenerate and
      # re-push this PR every day forever.
      - name: Record the retrieval baseline
        working-directory: data-pipeline
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
        run: npm run refresh:mark-retrieved
        timeout-minutes: 5

      - name: Refuse to proceed if anything outside the allowlist changed
        run: |
          set -euo pipefail
          # A data refresh may only touch generated data. Source code,
          # workflows and application files changing here would mean the job
          # did something it was not asked to.
          changed=$(git status --porcelain -- . | awk '{print $2}')
          bad=0
          for f in $changed; do
            case "$f" in
              data-pipeline/data/exports/*|data-pipeline/data/normalized/*|\
              data-pipeline/data/reports/*|data-pipeline/data/manifests/*|\
              data-pipeline/data/refresh-state.json|\
              src/sources/content/*) ;;
              *) echo "::error::refresh touched a path outside the allowlist: $f"; bad=1 ;;
            esac
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "OK: only generated data paths changed."

      - name: Summarise the candidate
        working-directory: data-pipeline
        run: |
          set -euo pipefail
          {
            echo "## Candidate data refresh"
            echo ""
            echo "Generated by run \`${{ github.run_id }}\`."
            echo ""
            echo "### Review before merging"
            echo ""
            echo "- Source changes are NOT automatically correct."
            echo "- Future-effective documents must stay staged as upcoming."
            echo "- Clinical summaries whose supporting content changed are stale until re-reviewed."
            echo ""
            echo '```'
            npm run refresh:manifests --silent || true
            echo '```'
          } > pr-body.md
          cat pr-body.md >> "$GITHUB_STEP_SUMMARY"

      # peter-evans/create-pull-request v7.0.5
      #
      # Uses the GitHub-provided token. No personal access token is required.
      #
      # WHY THIS CANNOT PILE UP OR LOOP, now that the schedule can reach it:
      #
      #   duplicates  the branch name is fixed (`data-refresh/automated`), and
      #               this action force-updates an existing branch and its open
      #               PR instead of opening a second one. A daily run that finds
      #               new changes revises yesterday's candidate in place.
      #   loops       pushes made with GITHUB_TOKEN do not trigger workflow
      #               runs, so the branch push here cannot start another
      #               pipeline-refresh or pipeline-tests run. Swapping in a
      #               personal access token WOULD remove that protection.
      #   noise       the scheduled arm only reaches this job when the check
      #               reported a real change, so a quiet month opens nothing.
      # NOTE for the repository owner: workflow-created pull requests need
      # Settings > Actions > General > "Allow GitHub Actions to create and
      # approve pull requests" to be enabled. If it is not, this step fails and
      # the uploaded artifact below is the fallback.
      - name: Open or update the data-refresh PR
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: data-refresh/automated
          base: main
          title: "data: automated source refresh"
          body-path: data-pipeline/pr-body.md
          commit-message: "data: automated source refresh"
          labels: data-refresh, needs-review
          delete-branch: false
          # Only generated data. Never source, workflows or app files.
          add-paths: |
            data-pipeline/data/exports/**
            data-pipeline/data/normalized/**
            data-pipeline/data/reports/**
            data-pipeline/data/manifests/**
            data-pipeline/data/refresh-state.json
            src/sources/content/**

      - name: Report PR outcome
        run: |
          if [ "${{ steps.pr.outcome }}" = "success" ]; then
            echo "Pull request step succeeded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::PR creation did not succeed. The validated candidate is attached as an artifact instead. Check Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'." >> "$GITHUB_STEP_SUMMARY"
          fi

      # actions/upload-artifact v4.4.3 - the fallback when PR creation is blocked.
      - name: Upload the validated candidate
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: candidate-exports
          path: |
            data-pipeline/data/exports/**
            data-pipeline/data/manifests/**
          retention-days: 14
          if-no-files-found: warn
